<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StudiPlanner — Analisi 1 & Geometria UNIMORE</title>
  
  <meta name="description" content="Single Page Application responsive per il ribilanciamento dinamico del piano di studi per Analisi 1 e Geometria UNIMORE fino al 10 Gennaio 2027." />
  <meta name="theme-color" content="#070b14" />

  <!-- PWA Manifest & Mobile Web App Meta -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StudiPlanner" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Tailwind CSS (Offline-first locale con fallback CDN) -->
  <script src="vendor/tailwindcss.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com';"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#111827',
                900: '#0f172a',
                950: '#070b14',
              }
            },
            animation: {
              'pulse-subtle': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 0.25s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.98)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              }
            }
          }
        }
      };
    }
  </script>

  <!-- React 18, ReactDOM 18 & SheetJS (Offline-first locali con fallback CDN) -->
  <script src="vendor/react.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js';"></script>
  <script src="vendor/react-dom.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js';"></script>
  <script src="vendor/xlsx.full.min.js" onerror="this.onerror=null;this.src='https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js';"></script>

  <!-- Babel Standalone (Offline-first locale con fallback CDN) -->
  <script src="vendor/babel.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@babel/standalone/babel.min.js';"></script>

  <style>
    /* Custom dark scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #070b14;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    body {
      background-color: #070b14;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen">
  <div id="root">
    <!-- Initial Loading State con Watchdog anti-schermo nero -->
    <div id="initial-loader" class="min-h-screen flex flex-col items-center justify-center p-4 select-none">
      <div class="relative w-16 h-16 mb-4">
        <div class="absolute inset-0 rounded-full border-4 border-cyan-500/20"></div>
        <div class="absolute inset-0 rounded-full border-4 border-cyan-400 border-t-transparent animate-spin"></div>
      </div>
      <h2 class="text-lg font-bold text-white tracking-wide">StudiPlanner</h2>
      <p class="text-xs text-slate-400 mt-1">Caricamento piano didattico UNIMORE...</p>
      
      <!-- Pulsante di emergenza mostrato solo in caso di ritardo -->
      <div id="loader-watchdog" class="hidden mt-6 text-center">
        <p class="text-xs text-amber-400/90 mb-3">Il caricamento iniziale richiede più tempo del previsto.</p>
        <button onclick="window.location.reload()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-white rounded-xl shadow-lg transition">
          Ricarica Pagina (F5)
        </button>
      </div>
    </div>
  </div>

  <!-- Watchdog script per prevenire qualsiasi blocco o schermo nero -->
  <script>
    setTimeout(function() {
      var loader = document.getElementById('initial-loader');
      var watchdog = document.getElementById('loader-watchdog');
      // Se dopo 3.5s il loader iniziale è ancora presente, mostra il pulsante di riavvio rapido
      if (loader && watchdog) {
        watchdog.classList.remove('hidden');
      }
    }, 3500);

    // Global Error Catcher prima di React
    window.addEventListener('error', function(e) {
      console.error('[StudiPlanner Global Error]', e);
      var root = document.getElementById('root');
      var loader = document.getElementById('initial-loader');
      if (loader) {
        var watchdog = document.getElementById('loader-watchdog');
        if (watchdog) watchdog.classList.remove('hidden');
      }
    });
  </script>

  <!-- Main Bundle Script -->
  <script type="text/babel" src="bundle.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) { console.log('[PWA] ServiceWorker registered with scope:', reg.scope); })
          .catch(function(err) { console.warn('[PWA] ServiceWorker registration warning:', err); });
      });
    }
  </script>
</body>
</html>
