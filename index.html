<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>StudiPlanner — Analisi 1 & Geometria UNIMORE</title>

  <meta name="description" content="Single Page Application responsive per il ribilanciamento dinamico del piano di studi per Analisi 1 e Geometria UNIMORE fino al 10 Gennaio 2027." />
  <meta name="theme-color" content="#F5F5F7" />

  <!-- PWA Manifest & Mobile Web App Meta -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="StudiPlanner" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Tailwind CSS (Offline-first locale con fallback CDN) -->
  <script src="vendor/tailwindcss.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com';"></script>
  <script>
    /*
     * Tema "Calma, stile Apple" (vedi docs/04-componenti-ui.md).
     * I componenti storici erano scritti per un tema scuro (slate-950 come sfondo, text-white come testo,
     * cyan/emerald come accenti). Qui la palette Tailwind viene rimappata su un tema chiaro:
     *  - la scala slate è invertita: 900 = card bianche, 950 = sfondo #F5F5F7, 100-300 = inchiostro;
     *  - "white" diventa l'inchiostro principale (#1D1D1F);
     *  - le tinte accese diventano i colori di sistema Apple: 500-700 colore pieno,
     *    50-400 inchiostro leggibile su sfondo chiaro, 800-950 tinte chiare per badge e superfici.
     * Il codice nuovo usa i token semantici (ink, canvas, surface, fill, hair, accent, analisi, geometria, ...).
     */
    window.SP_THEME = (function () {
      var hue = function (base, dark, deep, ink, t0, t1, t2) {
        return { 50: ink, 100: ink, 200: ink, 300: ink, 400: ink, 500: base, 600: dark, 700: deep, 800: t2, 900: t1, 950: t0 };
      };
      var blue    = hue('#0071E3', '#0066CC', '#0058B0', '#0062C4', '#F2F7FD', '#E6F0FC', '#CCE0F8');
      var indigo  = hue('#5E5CE6', '#5250D6', '#4341C2', '#4341C2', '#F5F5FE', '#ECECFC', '#D9D8F8');
      var purple  = hue('#AF52DE', '#9A45C7', '#8034AD', '#7A2FA6', '#FAF3FD', '#F4E7FB', '#E8CFF6');
      var green   = hue('#2DA44E', '#248A3D', '#1E7735', '#1B6B2F', '#F1FAF3', '#E3F7E8', '#C8EDD2');
      var teal    = hue('#0A9396', '#08807F', '#076B6D', '#076B6D', '#EFF9F9', '#E0F3F3', '#C2E7E7');
      var orange  = hue('#FF9F0A', '#E08600', '#B86E00', '#8A4B00', '#FFF8EE', '#FFF1DE', '#FFE2BD');
      var deepOr  = hue('#F56300', '#D95700', '#B84A00', '#A34400', '#FFF4EC', '#FFE9D9', '#FFD3B3');
      var red     = hue('#FF3B30', '#E0352B', '#C22D25', '#B0241B', '#FFF2F1', '#FFE5E3', '#FFCBC7');
      var pink    = hue('#FF2D55', '#E0284B', '#C2203F', '#B01E3D', '#FFF1F4', '#FFE3E9', '#FFC7D3');
      var sky     = hue('#32ADE6', '#1E9AD6', '#147FB3', '#0B6E99', '#F0F9FD', '#E1F3FB', '#C3E7F7');
      var neutral = {
        50: '#1D1D1F', 100: '#1D1D1F', 200: '#2C2C2E', 300: '#3A3A3C', 400: '#6E6E73', 500: '#6E6E73',
        600: '#A1A1A6', 700: '#D2D2D7', 750: '#DEDEE3', 800: '#E8E8ED', 850: '#F2F2F5', 900: '#FFFFFF', 950: '#F5F5F7'
      };
      return {
        palettes: {
          slate: neutral, gray: neutral, zinc: neutral, neutral: neutral, stone: neutral,
          cyan: blue, blue: blue, sky: sky, indigo: indigo, violet: indigo, purple: purple, fuchsia: purple,
          emerald: green, green: green, lime: green, teal: teal, amber: orange, yellow: orange,
          orange: deepOr, rose: red, red: red, pink: pink
        },
        solidHues: ['cyan', 'blue', 'sky', 'indigo', 'violet', 'purple', 'fuchsia', 'emerald', 'green', 'lime', 'teal', 'amber', 'yellow', 'orange', 'rose', 'red', 'pink']
      };
    })();

    if (window.tailwind) {
      var P = window.SP_THEME.palettes;
      var colors = { white: '#1D1D1F', paper: '#FFFFFF' };
      Object.keys(P).forEach(function (k) { colors[k] = P[k]; });
      Object.assign(colors, {
        ink: { DEFAULT: '#1D1D1F', 2: '#6E6E73', 3: '#A1A1A6' },
        canvas: '#F5F5F7',
        surface: { DEFAULT: '#FFFFFF', 2: '#FBFBFD' },
        sidebar: '#F3F3F6',
        fill: { DEFAULT: 'rgba(118,118,128,0.12)', 2: 'rgba(118,118,128,0.08)' },
        hair: 'rgba(0,0,0,0.08)',
        accent: { DEFAULT: '#0071E3', hover: '#0077ED', ink: '#0062C4', tint: '#E6F0FC' },
        analisi: { DEFAULT: '#5E5CE6', ink: '#4341C2', tint: '#ECECFC' },
        geometria: { DEFAULT: '#0A9396', ink: '#076B6D', tint: '#E0F3F3' },
        ok: { DEFAULT: '#34C759', ink: '#1B6B2F', tint: '#E3F7E8' },
        warn: { DEFAULT: '#FF9F0A', ink: '#8A4B00', tint: '#FFF1DE' },
        danger: { DEFAULT: '#FF3B30', ink: '#B0241B', tint: '#FFE5E3' }
      });
      tailwind.config = {
        theme: {
          extend: {
            colors: colors,
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Inter', '"Segoe UI Variable Text"', '"Segoe UI"', 'system-ui', 'sans-serif'],
              display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Inter', '"Segoe UI Variable Display"', '"Segoe UI"', 'system-ui', 'sans-serif']
            },
            boxShadow: {
              card: '0 0 0 0.5px rgba(0,0,0,0.06), 0 2px 10px rgba(0,0,0,0.04)',
              float: '0 0 0 0.5px rgba(0,0,0,0.08), 0 12px 40px -12px rgba(0,0,0,0.22)',
              seg: '0 1px 2px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.04)'
            },
            animation: {
              'pulse-subtle': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 0.25s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.98)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              }
            }
          }
        }
      };
    }

    // Testo bianco sui bottoni pieni colorati (dove "white" rimappato sarebbe inchiostro scuro).
    (function () {
      var sel = [];
      window.SP_THEME.solidHues.forEach(function (h) {
        [500, 600, 700].forEach(function (s) {
          ['bg', 'from'].forEach(function (p) {
            var c = '[class~="' + p + '-' + h + '-' + s + '"]';
            sel.push(c + '.text-white', c + ' .text-white', c + '.text-slate-950', c + '.text-slate-900', c + '.text-black');
          });
        });
      });
      var st = document.createElement('style');
      st.id = 'sp-solid-text';
      st.textContent = sel.join(',') + '{color:#FFFFFF!important}';
      document.head.appendChild(st);
    })();
  </script>

  <!-- React 18, ReactDOM 18 & SheetJS (Offline-first locali con fallback CDN) -->
  <script src="vendor/react.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js';"></script>
  <script src="vendor/react-dom.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js';"></script>
  <script src="vendor/xlsx.full.min.js" onerror="this.onerror=null;this.src='https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js';"></script>

  <!-- Babel Standalone (Offline-first locale con fallback CDN) -->
  <script src="vendor/babel.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@babel/standalone/babel.min.js';"></script>

  <style>
    :root { color-scheme: light; }
    html, body {
      background-color: #F5F5F7;
      color: #1D1D1F;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::selection { background: rgba(0, 113, 227, 0.2); }

    /* Scrollbar sottili come macOS */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.32); border: 3px solid transparent; background-clip: content-box; }

    /* Numeri tabulari al posto del monospace "da terminale" */
    .font-mono { font-family: inherit !important; font-variant-numeric: tabular-nums; letter-spacing: normal; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Niente gradienti: superfici piatte con il colore iniziale del gradiente */
    [class*="bg-gradient-to-"] { background-image: linear-gradient(var(--tw-gradient-from, transparent), var(--tw-gradient-from, transparent)) !important; }
    [class*="bg-clip-text"] { -webkit-text-fill-color: currentColor !important; background: none !important; }

    /* Niente bagliori colorati: ombre neutre e morbide */
    * { --tw-shadow-color: rgba(0, 0, 0, 0.08) !important; }

    /* Card dei componenti storici: bordo sottile e ombra leggera */
    .bg-slate-900.border, .bg-slate-900\/80.border, .bg-slate-900\/60.border, .bg-slate-900\/50.border, .bg-slate-900\/40.border {
      border-color: rgba(0, 0, 0, 0.06);
      box-shadow: 0 0 0 0.5px rgba(0,0,0,0.03), 0 2px 10px rgba(0,0,0,0.035);
    }

    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid rgba(0, 113, 227, 0.35);
      outline-offset: 1px;
    }
    input[type="checkbox"], input[type="radio"], input[type="range"] { accent-color: #0071E3; }

    /* Vetro smerigliato (sidebar, header, tab bar mobile) */
    .vibrancy { background-color: rgba(246, 246, 248, 0.8); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
    .pb-safe { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
    .large-title { font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -0.035em; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6E6E73; }
  </style>
</head>
<body class="bg-canvas text-ink min-h-screen">
  <div id="root">
    <!-- Initial Loading State con Watchdog anti-schermo nero -->
    <div id="initial-loader" class="min-h-screen flex flex-col items-center justify-center p-4 select-none">
      <div class="relative w-12 h-12 mb-4">
        <div class="absolute inset-0 rounded-full border-4 border-accent/15"></div>
        <div class="absolute inset-0 rounded-full border-4 border-accent border-t-transparent animate-spin"></div>
      </div>
      <h2 class="text-lg font-semibold text-ink tracking-tight">StudiPlanner</h2>
      <p class="text-xs text-ink-2 mt-1">Caricamento piano didattico UNIMORE...</p>

      <!-- Pulsante di emergenza mostrato solo in caso di ritardo -->
      <div id="loader-watchdog" class="hidden mt-6 text-center">
        <p class="text-xs text-warn-ink mb-3">Il caricamento iniziale richiede più tempo del previsto.</p>
        <button onclick="window.location.reload()" class="px-4 py-2 bg-accent hover:bg-accent-hover text-xs font-semibold text-paper rounded-full transition">
          Ricarica Pagina (F5)
        </button>
      </div>
    </div>
  </div>

  <!-- Watchdog script per prevenire qualsiasi blocco o schermo nero -->
  <script>
    setTimeout(function() {
      var loader = document.getElementById('initial-loader');
      var watchdog = document.getElementById('loader-watchdog');
      // Se dopo 3.5s il loader iniziale è ancora presente, mostra il pulsante di riavvio rapido
      if (loader && watchdog) {
        watchdog.classList.remove('hidden');
      }
    }, 3500);

    // Global Error Catcher prima di React
    window.addEventListener('error', function(e) {
      console.error('[StudiPlanner Global Error]', e);
      var root = document.getElementById('root');
      var loader = document.getElementById('initial-loader');
      if (loader) {
        var watchdog = document.getElementById('loader-watchdog');
        if (watchdog) watchdog.classList.remove('hidden');
      }
    });
  </script>

  <!-- Main Bundle Script -->
  <script type="text/babel" src="bundle.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) { console.log('[PWA] ServiceWorker registered with scope:', reg.scope); })
          .catch(function(err) { console.warn('[PWA] ServiceWorker registration warning:', err); });
      });
    }
  </script>
</body>
</html>
